[project]
name = "ml-summative"
version = "0.1.0"
description = "Predicting student exam scores with multivariate linear regression, FastAPI, and Flutter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "joblib>=1.3",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "summative/__init__.py",
    "summative/API",
]

[tool.uv]
package = true
